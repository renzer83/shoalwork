[project]
name = "reflex"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "datasets==5.1.0",
    "fastapi==0.147.0",
    "numpy==2.5.4",
    "onnxruntime==1.31.0",
    "pydantic==2.14.1",
    "pyyaml==6.0.3",
    "scikit-learn==1.9.1",
    "transformers==5.20.1",
    "uvicorn==0.54.0",
]

[project.scripts]
reflex-data = "reflex.data.cli:main"
reflex-model = "reflex.model.cli:main"

[project.optional-dependencies]
gpu = [
    "onnxruntime-gpu==1.31.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
