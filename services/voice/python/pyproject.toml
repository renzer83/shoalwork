[project]
name = "shoalwork-voice-tts"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.147.0",
    "kokoro-onnx==0.6.1",
    "numpy==2.5.4",
    "openwakeword==0.6.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]

[tool.uv]
package = false
# openwakeword 0.6.0 pins tflite-runtime on Linux, which has no cp313 wheel. The sidecar runs ONNX only
# (inference_framework="onnx"), so the TFLite backend is dropped from the resolution.
exclude-dependencies = ["tflite-runtime"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
