packages:
  - "packages/*"
  - "services/*"
  - "apps/*"

nodeLinker: hoisted

allowBuilds:
  esbuild: false
  electron: true

# One copy of the React runtime across the apps and the shared UI (Expo needs it).
overrides:
  react: "catalog:"
  react-dom: "catalog:"
  react-native: "catalog:"
  # Keeps one vite across vitest and the desktop build; 8.3.5 is inside the release-age quarantine.
  vite: 8.3.4

catalog:
  effect: 4.0.5
  "@effect/platform-node": 4.0.5
  "@effect/sql-sqlite-node": 4.0.5
  "@effect/vitest": 4.0.5
  vitest: 5.0.5
  typescript: 7.0.2
  "@types/node": 26.6.5
  hono: 4.13.13
  "@hono/node-server": 2.1.5
  "@anthropic-ai/sdk": 0.135.0
  "@modelcontextprotocol/client": 2.3.1
  "@modelcontextprotocol/server": 2.3.1
  yaml: 2.9.1
  zod: 4.6.7
  croner: 10.0.1
  grammy: 1.46.0
  "@grammyjs/runner": 2.0.3
  "@grammyjs/auto-retry": 2.0.2
  expo: 58.0.14
  expo-router: ~58.0.23
  "@expo/metro-runtime": 58.0.14
  react-native: 0.88.0
  react: 19.3.0
  react-dom: 19.3.0
  react-native-web: ~0.21.4
  react-native-paper: 5.15.3
  react-native-safe-area-context: ~5.10.1
  react-native-screens: ~4.30.0
  react-native-reanimated: 4.7.1
  react-native-worklets: 0.13.0
  react-native-svg: 15.16.0
  expo-linking: ~58.0.13
  expo-secure-store: ~58.0.2
  expo-constants: ~58.0.12
  expo-status-bar: ~58.0.3
  electron: 44.9.0
  "@electron-forge/cli": 8.0.1
  "@electron-forge/plugin-vite": 8.0.1
  electron-updater: 6.8.9
